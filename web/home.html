<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Climáticos - Home</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- RF002 - Tela Home -->
    <header>
        <h2>Eventos Climáticos</h2>

        <div class="usuario">
            <button id="btnNovo" class="btn-novo" title="Novo evento">+</button>
            <!-- RF002.1 nome do usuario logado -->
            <span id="nomeUsuario"></span>
            <!-- RF002.2 botao sair -->
            <button id="btnSair" class="btn-sair">Sair</button>
        </div>
    </header>

    <main>
        <!-- RF002.3 lista de eventos -->
        <ul id="lista"></ul>
    </main>

    <!-- Modal de cadastro / edicao -->
    <div id="modal" class="modal">
        <div class="modal-conteudo">
            <h3 id="tituloModal">Novo evento</h3>

            <form id="formEvento">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" maxlength="50">

                <label for="tipoEvento">Tipo do evento</label>
                <input type="text" id="tipoEvento" maxlength="50" placeholder="Ex: Tempestade, Geada...">

                <label for="temperaturaMaxima">Temperatura máxima (°C)</label>
                <input type="number" id="temperaturaMaxima" step="0.1">

                <label for="data">Data</label>
                <input type="date" id="data">

                <label for="nivelImpacto">Nível de impacto</label>
                <textarea id="nivelImpacto" maxlength="100" rows="3"></textarea>

                <p id="erroEvento" class="erro"></p>

                <div class="botoes">
                    <button type="button" id="btnCancelar" class="btn-cancelar">Cancelar</button>
                    <button type="submit" id="btnSalvar">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
